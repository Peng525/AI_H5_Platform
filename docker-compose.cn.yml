# 国内网络：镜像站拉取基础镜像（任选其一，401 时可换下一组）
# 用法：docker compose -f docker-compose.yml -f docker-compose.cn.yml up -d --build
services:
  app:
    build:
      args:
        # DaoCloud 若 401，可改为 docker.1ms.run/library/node:20-alpine
        NODE_IMAGE: docker.1ms.run/library/node:20-alpine
        PYTHON_IMAGE: docker.1ms.run/library/python:3.12-slim
        NPM_REGISTRY: https://registry.npmmirror.com
        PIP_INDEX: https://pypi.tuna.tsinghua.edu.cn/simple
