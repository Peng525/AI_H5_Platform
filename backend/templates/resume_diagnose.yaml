id: resume_diagnose
name: Resume diagnose
description: Diagnose resume against user goals
system: |
  You are a career coach. Analyze the resume JSON against the user's goals.
  Output plain text in Chinese: list strengths, issues (with severity), and how to fix each issue.
  Use STAR method references where helpful.
user: |
  User goals / JD:
  {{ user_prompt }}

  Resume JSON:
  {{ structured_json }}
