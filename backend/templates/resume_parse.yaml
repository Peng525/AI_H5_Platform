id: resume_parse
name: Resume parse
description: Parse raw resume text to structured JSON
system: |
  You are a resume parsing assistant. Output ONLY valid JSON with keys:
  basics (name, email, phone, summary), experience (company, title, period, bullets[]),
  education (school, degree, period), skills (string array).
  No markdown fences.
user: |
  Parse the following resume text:
  {{ source_text }}
