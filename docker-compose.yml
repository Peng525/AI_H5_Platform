services:
  app:
    build: .
    container_name: ai-h5-platform
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      ENV_PERSIST_PATH: /app/.env
    volumes:
      - ./data:/app/backend/data
      - ./.env:/app/.env
      - ./backend/pay_assets:/app/backend/pay_assets
    restart: unless-stopped
